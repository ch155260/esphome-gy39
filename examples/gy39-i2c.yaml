esphome:
  name: gy39-i2c

esp8266:
  board: d1_mini

logger:

external_components:
  - source:
      type: local
      path: ../components
    components: [gy39]

i2c:
  sda: GPIO4   # 接 GY-39 的 DR
  scl: GPIO5   # 接 GY-39 的 CT
  frequency: 50kHz

sensor:
  - platform: gy39
    interface: i2c
    address: 0x5B
    update_interval: 10s
    illuminance:
      name: "GY39 Illuminance"
    temperature:
      name: "GY39 Temperature"
    pressure:
      name: "GY39 Pressure"
    humidity:
      name: "GY39 Humidity"
    altitude:
      name: "GY39 Altitude"
    absolute_humidity:
      name: "GY39 Absolute Humidity"
    dew_point:
      name: "GY39 Dew Point"

# GY-39 in I2C mode (S0 tied to GND) on an ESP8266 (D1 mini), imported as a package.
# GY-39 I2C 模式（S0 接地），接在 ESP8266（D1 mini）上，用 package 匯入。
#
# Wiring / 接線: VCC -> 3V3, GND -> GND, CT -> D1 (GPIO5, SCL), DR -> D2 (GPIO4, SDA), S0 -> GND
esphome:
  name: gy39-i2c
  friendly_name: GY39

esp8266:
  board: d1_mini

logger:

# The I2C package uses the bus from this config / I2C package 使用這裡定義的匯流排
i2c:
  sda: GPIO4          # D2 -> GY-39 DR
  scl: GPIO5          # D1 -> GY-39 CT
  frequency: 50kHz    # recommended, the module's MCU is slow / 建議值，模組 MCU 回應較慢
  scan: true          # the log should show a device at 0x5B / log 應該會掃到 0x5B

packages:
  gy39:
    url: https://github.com/ch155260/esphome-gy39
    ref: main
    refresh: 1d
    files:
      - path: packages/gy39-i2c.yaml
        vars:
          gy39_station_altitude: "35"     # required: sensor height above sea level (m) / 必填：感測器海拔（m）
          # gy39_name_prefix: "陽台 "     # entity name prefix / 實體名稱前綴
          # gy39_tendency_language: zh-TW # Chinese tendency text / 中文趨勢文字

# Optional: change the package / 選用：修改 package 內容
# sensor:
#   - id: !extend gy39_sensor
#     temperature_offset: -0.8
#     humidity_calibration: ["34.0 -> 32.8", "77.5 -> 75.3"]

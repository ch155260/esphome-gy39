# GY-39 in UART mode (factory default) on an ESP32, imported as a package.
# GY-39 UART 模式（出廠預設），接在 ESP32 上，用 package 匯入。
#
# Wiring / 接線: VCC -> 3V3, GND -> GND, CT -> GPIO16 (ESP RX), DR -> GPIO17 (ESP TX), S0 unconnected / 懸空
# ESP8266: see README "UART example" / ESP8266 請參考 README 的「UART 使用範例」
esphome:
  name: gy39-uart
  friendly_name: GY39

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# One place controls the version of both the package and the component
# 同時控制 package 和元件版本的地方
substitutions:
  gy39_version: main      # branch / tag / commit (e.g. v1.1.0) / 分支、tag 或 commit
  gy39_refresh: 1d        # re-download interval; "always" while testing / 重新下載頻率，測試時可用 always

logger:

packages:
  gy39:
    url: https://github.com/ch155260/esphome-gy39
    ref: ${gy39_version}
    refresh: ${gy39_refresh}
    files:
      - path: packages/gy39-uart.yaml
        vars:
          gy39_ref: ${gy39_version}       # component = package version / 元件與 package 同版本
          gy39_refresh: ${gy39_refresh}   # component = package refresh / 元件與 package 同更新頻率
          gy39_station_altitude: "35"     # required: sensor height above sea level (m) / 必填：感測器海拔（m）
          gy39_tx_pin: GPIO17             # ESP TX -> GY-39 DR
          gy39_rx_pin: GPIO16             # ESP RX <- GY-39 CT
          # gy39_tendency_language: zh-TW # Chinese tendency text / 中文趨勢文字

# Optional: change the package / 選用：修改 package 內容
# sensor:
#   - id: !extend gy39_sensor

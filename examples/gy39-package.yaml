# Minimal device config that pulls everything from the GY-39 package.
esphome:
  name: balcony-gy39

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

packages:
  gy39:
    url: https://github.com/ch155260/esphome-gy39
    ref: main
    refresh: 1d
    files:
      - path: packages/gy39-uart.yaml      # or packages/gy39-i2c.yaml
        vars:
          gy39_station_altitude: "31"      # required: sensor height above sea level (m)
          gy39_tx_pin: GPIO17
          gy39_rx_pin: GPIO16
          gy39_tendency_language: zh-TW

# Optional: change or remove things from the package
sensor:
  - id: !extend gy39_sensor
    temperature_offset: -0.8
    illuminance: !remove

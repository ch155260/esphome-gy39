# =====================================================================
# GY-39 package — I2C mode through the on-board MCU (address 0x5B)
# https://github.com/ch155260/esphome-gy39
#
# Wiring: VCC -> 3V3, GND -> GND, CT -> SCL, DR -> SDA
#         S0 tied to GND (I2C mode; power-cycle the module after changing it)
#         Leave the chip-side SCL/SDA/INT pins (if your board has them) unconnected
#
# Your main config must define the I2C bus, e.g.
#   i2c:
#     sda: GPIO4
#     scl: GPIO5
#     frequency: 50kHz     # recommended, the MCU is slow
# With several buses, select one:  sensor: [{id: !extend gy39_sensor, i2c_id: my_bus}]
#
# packages:
#   gy39:
#     url: https://github.com/ch155260/esphome-gy39
#     ref: main
#     files:
#       - path: packages/gy39-i2c.yaml
#         vars:
#           gy39_station_altitude: "31"
#
# IDs: ${gy39_id}_sensor (platform entry, use with !extend),
#      ${gy39_id}_temperature, ${gy39_id}_dew_point, ... (one per sensor below)
# =====================================================================

defaults:
  gy39_id: gy39
  gy39_name_prefix: ""              # e.g. "Balcony " or "陽台 " (with trailing space)
  gy39_update_interval: 60s
  gy39_tendency_language: en        # en / zh-TW
  gy39_temperature_offset: "0"      # °C
  gy39_pressure_offset: "0"         # hPa
  gy39_failure_timeout: 60s         # no good reading for this long -> values become unknown (NaN)
  gy39_ref: main                    # component version: branch / tag / commit
  # gy39_station_altitude           REQUIRED, no default: sensor height above sea level (m)
  gy39_address: "0x5B"

external_components:
  - source: github://ch155260/esphome-gy39@${gy39_ref}
    components: [gy39]
    refresh: 1d

sensor:
  - platform: gy39
    id: ${gy39_id}_sensor            # not just "gy39": that clashes with the integration name
    interface: i2c
    address: ${gy39_address}
    update_interval: ${gy39_update_interval}
    station_altitude: ${gy39_station_altitude}
    tendency_language: ${gy39_tendency_language}
    temperature_offset: ${gy39_temperature_offset}
    pressure_offset: ${gy39_pressure_offset}
    failure_timeout: ${gy39_failure_timeout}

    # ---------- Measured / 實測值 ----------
    temperature:
      id: ${gy39_id}_temperature
      name: "${gy39_name_prefix}Temperature"
    humidity:
      id: ${gy39_id}_humidity
      name: "${gy39_name_prefix}Humidity"
    pressure:
      id: ${gy39_id}_pressure
      name: "${gy39_name_prefix}Pressure"
    illuminance:
      id: ${gy39_id}_illuminance
      name: "${gy39_name_prefix}Illuminance"

    # ---------- Calculated / 計算值 ----------
    dew_point:
      id: ${gy39_id}_dew_point
      name: "${gy39_name_prefix}Dew Point"
    absolute_humidity:
      id: ${gy39_id}_absolute_humidity
      name: "${gy39_name_prefix}Absolute Humidity"
    mixing_ratio:
      id: ${gy39_id}_mixing_ratio
      name: "${gy39_name_prefix}Mixing Ratio"
    sea_level_pressure:
      id: ${gy39_id}_sea_level_pressure
      name: "${gy39_name_prefix}Sea Level Pressure"

    # ---------- Trends (published every 10 min / on change) / 趨勢 ----------
    pressure_trend_3h:
      id: ${gy39_id}_pressure_trend_3h
      name: "${gy39_name_prefix}Pressure Trend 3h"
    pressure_trend_24h:
      id: ${gy39_id}_pressure_trend_24h
      name: "${gy39_name_prefix}Pressure Trend 24h"
    pressure_tendency:
      id: ${gy39_id}_pressure_tendency
      name: "${gy39_name_prefix}Pressure Tendency"
